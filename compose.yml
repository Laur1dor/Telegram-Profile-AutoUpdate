services:
  tgtime:
    build: .
    container_name: tgtime
    env_file: .env
    environment:
      # Пусто = напрямую. В сетях, где Telegram блокируется, укажите один из
      # прокси ниже и поднимите соответствующий профиль.
      PROXY_URL: ${PROXY_URL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Профиль "vless": свой VLESS-узел. Конфиг собирается из подписки или из
  # списка ссылок, подписка обновляется по расписанию, мёртвые узлы выпадают.
  #   docker compose --profile vless up -d   +   PROXY_URL=socks5://xray:2080
  xray:
    build:
      context: .
      dockerfile: Dockerfile.xray
    container_name: tgtime-xray
    profiles: ["vless"]
    environment:
      VLESS_SUBSCRIPTION: ${VLESS_SUBSCRIPTION:-}
      VLESS_CONFIGS: ${VLESS_CONFIGS:-}
      VLESS_CONFIGS_FILE: ${VLESS_CONFIGS_FILE:-}
      VLESS_UPDATE_INTERVAL: ${VLESS_UPDATE_INTERVAL:-21600}
    volumes:
      - ./data:/app/data:ro     # необязательно: data/vless.txt для VLESS_CONFIGS_FILE
    restart: unless-stopped

  # Профиль "warp": Cloudflare WARP как SOCKS5. Не требует своего сервера, но
  # проходит не во всех сетях — где его фильтруют, берите профиль "vless".
  #   docker compose --profile warp up -d    +   PROXY_URL=socks5://warp:1080
  warp:
    image: caomingjun/warp
    container_name: tgtime-warp
    profiles: ["warp"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: "5"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    restart: unless-stopped

volumes:
  warp-data:
